[plugin]

name="GDLLM - An in-editor Godot Agentic Harness"
description="A fully transparent in-editor agentic harness for large language models inside the Godot Engine. Connect to any LLM provider via API and provide your agents the tools, context management, and guidance to effectively complete most tasks in Godot. Every action the agent takes is fully surfaced and persists in session history."
author="Exonfang"
version="1.1.0"
script="gdllm.gd"
