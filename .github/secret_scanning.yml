## GitHub Secret Scanning configuration for this fork.
##
## The public Antigravity CLI OAuth client_id and client_secret bundled
## in `addons/gdllm-godot-agentic-harness/gdllm_gemini_oauth.gd` match
## GitHub's "Google API key" / generic client-secret detectors as a
## false-positive — they are the public credentials shipped with the
## official Antigravity binary (kept verbatim to stay compatible with
## every install). Whitelist the file path so push protection does not
## block on it.
##
## Reviewers MUST still treat the `DEFAULT_CLIENT_ID` and
## `DEFAULT_CLIENT_SECRET` values in that file as the same fixed strings
## shipped by the official Antigravity binary — any change risks
## breaking every install.

paths-ignore:
  - "addons/gdllm-godot-agentic-harness/gdllm_gemini_oauth.gd"
